<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TokenCore 奖励平台</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        :root { --pico-font-size: 93.75%; }
        body { min-height: 100vh; }
        .container { max-width: 800px; padding-top: 1rem; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        nav.tabs { margin-bottom: 1.5rem; }
        nav.tabs a { cursor: pointer; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { margin-bottom: 1rem; padding: 1rem; border: 1px solid var(--pico-muted-border-color); border-radius: var(--pico-border-radius); }
        .reward-tag { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: .85em; font-weight: bold; }
        .reward-tag.token { background: #e8f5e9; color: #2e7d32; }
        .reward-tag.nft { background: #f3e5f5; color: #7b1fa2; }
        .reward-tag.giftcard { background: #fff3e0; color: #e65100; }
        .reward-tag.amount { background: #e3f2fd; color: #1565c0; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: .8em; }
        .badge-success { background: #e8f5e9; color: #2e7d32; }
        .badge-warning { background: #fff8e1; color: #f57f17; }
        .badge-info { background: #e3f2fd; color: #1565c0; }
        .badge-error { background: #fbe9e7; color: #c62828; }
        #user-bar { font-size: .9em; }
        .wallet-addr { font-family: monospace; word-break: break-all; font-size: .85em; padding: .5rem; background: var(--pico-code-background-color); border-radius: 4px; }
        .empty-state { text-align: center; padding: 2rem; color: var(--pico-muted-color); }
        .btn-group { display: flex; gap: .5rem; flex-wrap: wrap; }
        #loading { display: none; text-align: center; padding: 1rem; }
        .toast { position: fixed; top: 1rem; right: 1rem; z-index: 999; max-width: 350px; }
    </style>
</head>
<body>
<div class="container">

    <!-- Header -->
    <header>
        <h1>TokenCore 奖励平台</h1>
        <div id="user-bar">
            <span id="user-info" style="display:none">
                已登录: <strong id="display-username"></strong>
                <button class="outline secondary small" onclick="logout()">登出</button>
            </span>
            <span id="guest-info">未登录</span>
        </div>
    </header>

    <!-- Tabs -->
    <nav class="tabs">
        <ul>
            <li><a role="button" class="outline" onclick="switchTab('account')" id="tab-btn-account">账户</a></li>
            <li><a role="button" class="outline" onclick="switchTab('tasks')" id="tab-btn-tasks">任务大厅</a></li>
            <li><a role="button" class="outline" onclick="switchTab('wallet')" id="tab-btn-wallet">我的钱包</a></li>
            <li><a role="button" class="outline" onclick="switchTab('rewards')" id="tab-btn-rewards">奖励记录</a></li>
        </ul>
    </nav>

    <!-- Toast -->
    <div id="toast" class="toast" style="display:none"></div>
    <div id="loading" aria-busy="true">处理中...</div>

    <!-- Tab: 账户 -->
    <section id="tab-account" class="tab-content active">
        <article>
            <h3 id="account-title">登录 / 注册</h3>
            <form id="auth-form" onsubmit="handleAuth(event)">
                <label>用户名
                    <input type="text" id="auth-username" required minlength="3" maxlength="30" placeholder="3-30个字符">
                </label>
                <label>密码
                    <input type="password" id="auth-password" required minlength="6" placeholder="至少6个字符">
                </label>
                <div class="btn-group">
                    <button type="button" class="secondary" onclick="doRegister()">注册</button>
                    <button type="submit">登录</button>
                </div>
            </form>
            <div id="register-result" style="margin-top:1rem; display:none"></div>
        </article>
    </section>

    <!-- Tab: 任务大厅 -->
    <section id="tab-tasks" class="tab-content">
        <div class="btn-group" style="margin-bottom:1rem">
            <button onclick="loadTasks()">刷新任务</button>
            <button class="secondary" onclick="generateTasks()" id="btn-generate">AI 生成任务</button>
        </div>
        <div id="tasks-list"></div>
    </section>

    <!-- Tab: 钱包 -->
    <section id="tab-wallet" class="tab-content">
        <article>
            <h3>钱包信息</h3>
            <p><span id="tokencore-status" style="float:right"></span></p>
            <p><strong>地址:</strong> <span class="wallet-addr" id="wallet-addr">—</span></p>
            <p><strong>ETH 余额 (Sepolia):</strong> <span id="eth-balance">—</span> ETH</p>
            <p><strong>平台积分:</strong> <span id="platform-balance">—</span> TOKEN</p>
        </article>

        <article>
            <h4>导出助记词</h4>
            <p style="font-size:.85em;color:var(--pico-muted-color)">助记词是恢复钱包的唯一凭证，请勿泄露</p>
            <label>输入 Keystore 密码验证:
                <input type="password" id="mnemonic-password" placeholder="注册时生成的密码">
            </label>
            <button onclick="exportMnemonic()" class="secondary">导出助记词</button>
            <div id="mnemonic-result" style="margin-top:.5rem;display:none">
                <div class="wallet-addr" id="mnemonic-words" style="word-break:break-word"></div>
                <p class="badge badge-warning" style="margin-top:.25rem">请立即抄写保存，关闭页面后将无法再次查看</p>
            </div>
        </article>

        <h4>交易记录</h4>
        <div id="tx-list"></div>
    </section>

    <!-- Tab: 奖励记录 -->
    <section id="tab-rewards" class="tab-content">
        <h4>我的奖励</h4>
        <div id="rewards-list"></div>
    </section>

</div>

<script src="/static/main.js"></script>
</body>
</html>
